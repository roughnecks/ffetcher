# Each section name is the JID of a MUC room.
# Each key is an arbitrary label; its value is a feed URL.
# A MUC can have any number of feeds.

[room-one@conference.example.com]
feed1 = https://www.debian.org/News/news
feed2 = https://www.debian.org/security/dsa-long

[room-two@conference.example.com]
feed1 = https://other.example.com/atom.xml

# Articles whose body or link contain any of these words will be silently
# dropped. Matching is case-insensitive and whole-word only, so "wine"
# will not match "winefactory". This section is optional.

[badwords]
word1 = casino
word2 = sponsor
word3 = giveaway